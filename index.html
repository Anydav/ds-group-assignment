<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Science Group Assignment</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main>
    <h1>Data Science Group Assignment</h1>
    <p class="subtitle">Type your full name to get your group and the table you will work on.</p>
    <div id="banner" class="banner" hidden></div>

    <div class="card">
      <label for="name">Your full name</label>
      <input id="name" autocomplete="name" placeholder="e.g. Chinedu Okafor">
      <button id="go">Get my group</button>
      <div id="msg" class="msg"></div>
    </div>

    <div id="result" class="card result" hidden></div>

    <button id="showAll" class="secondary">Show all groups</button>
    <div id="list" style="margin-top:14px"></div>
  </main>
</body>
</html>
