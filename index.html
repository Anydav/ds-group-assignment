<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b5bdb">
  <title>Data Science Group Assignment</title>
  <!-- After changing any css/js file, bump v=… on every line below so browsers (especially Safari)
       fetch the new files instead of their cached copies. -->
  <link rel="stylesheet" href="css/styles.css?v=7">
  <script type="importmap">
  {
    "imports": {
      "./js/config.js":  "./js/config.js?v=7",
      "./js/assign.js":  "./js/assign.js?v=7",
      "./js/storage.js": "./js/storage.js?v=7",
      "./js/ui.js":      "./js/ui.js?v=7"
    }
  }
  </script>
  <script type="module" src="js/main.js?v=7"></script>
</head>
<body>
  <header class="hero">
    <span class="hero-tag">Data Science</span>
    <h1>Group Assignment</h1>
    <p>Type your full name to get your group and the table you will work on.</p>
  </header>

  <main>
    <div id="banner" class="banner" hidden></div>

    <div class="card">
      <label for="name">Your full name</label>
      <input id="name" autocomplete="name" placeholder="e.g. Chinedu Okafor">
      <button id="go">Get my group</button>
      <div id="msg" class="msg"></div>
    </div>

    <div id="result" class="card result" hidden></div>

    <button id="showAll" class="secondary">Show all groups</button>
    <div id="list"></div>
  </main>
</body>
</html>
